<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="영수증"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="apple-touch-icon"
    href="./icon.png"
  >

  <title>영수증 정리</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #appFrame {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;
      background: white;
    }

    #loading {
      position: fixed;
      inset: 0;

      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: white;

      font-size: 16px;
      color: #555;
    }

    .spinner {
      width: 38px;
      height: 38px;

      margin-bottom: 16px;

      border: 4px solid #eeeeee;
      border-top-color: #222;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

  </style>

</head>


<body>


<div id="loading">

  <div class="spinner"></div>

  영수증 앱을 불러오는 중...

</div>


<iframe
  id="appFrame"
  allow="camera; fullscreen"
></iframe>


<script>

  /*
    ==============================
    여기에 Apps Script 웹앱 주소 입력
    ==============================
  */

  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbwwlGsAzAUwkgl4mf8r0nA4bEErEAHetToO9Q1xsyP3Auy2EzYlIPdvP-IMRSm7Pds3/exec';


  const frame =
    document.getElementById(
      'appFrame'
    );


  const loading =
    document.getElementById(
      'loading'
    );


  frame.src =
    APPS_SCRIPT_URL;


  frame.addEventListener(
    'load',
    function() {

      loading.style.display =
        'none';

    }
  );


  /*
    PWA Service Worker 등록
  */

  if (
    'serviceWorker' in navigator
  ) {

    window.addEventListener(
      'load',
      function() {

        navigator
          .serviceWorker
          .register('./sw.js')
          .catch(
            function(error) {

              console.error(
                'Service Worker error:',
                error
              );

            }
          );

      }
    );

  }

</script>


</body>

</html>
